name: 在庫・施工事例データの更新

on:
  schedule:
    - cron: "17 */6 * * *"   # 6時間ごと（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 公式サイトの公開データからJSONを作る（読み取りのみ）
        run: python3 scripts/build_data.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "ats-app-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "在庫・施工事例データを更新（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"
          git push
